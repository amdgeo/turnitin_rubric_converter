name: Python application

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            executable: rubric-converter.exe
          - os: ubuntu-latest
            name: linux
            executable: rubric-converter
          - os: macos-latest
            name: macos
            executable: rubric-converter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build executable
        shell: bash
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --name "${{ matrix.executable }}" rubric_converter_gui.py
      - name: Build Windows installer
        if: matrix.name == 'windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer/rubric-converter.iss
          options: /DMyAppVersion=${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: rubric-converter-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
